<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7faff"/>
      <stop offset="1" stop-color="#dbe7ff"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f6df6" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#2f6df6" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>

  <!-- text -->
  <g font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="72" y="120" font-size="22" font-weight="600" fill="#2f6df6" letter-spacing="3">CHROME EXTENSION</text>
    <text x="72" y="182" font-size="60" font-weight="800" fill="#314863">PriceWatch AI</text>
    <text x="72" y="228" font-size="24" fill="#314863" opacity="0.8">Track the price. Know when to buy.</text>
  </g>

  <!-- price chart -->
  <g transform="translate(640,60)">
    <line x1="0" y1="200" x2="480" y2="200" stroke="#314863" stroke-opacity="0.15" stroke-width="2"/>
    <line x1="0" y1="138" x2="480" y2="138" stroke="#314863" stroke-opacity="0.25" stroke-width="2" stroke-dasharray="6 8"/>
    <text x="0" y="162" text-anchor="start" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" fill="#314863" opacity="0.6">historical low</text>
    <path d="M0,70 L50,55 L100,80 L150,62 L200,95 L250,88 L300,118 L350,104 L400,140 L400,200 L0,200 Z" fill="url(#area)"/>
    <polyline points="0,70 50,55 100,80 150,62 200,95 250,88 300,118 350,104 400,140"
      fill="none" stroke="#2f6df6" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
    <polyline points="400,140 480,122" fill="none" stroke="#2f6df6" stroke-width="4" stroke-dasharray="4 8" stroke-linecap="round" opacity="0.6"/>
    <circle cx="400" cy="140" r="14" fill="#1b7a49" opacity="0.18"/>
    <circle cx="400" cy="140" r="8" fill="#1b7a49"/>
    <g transform="translate(340,20)">
      <rect width="120" height="44" rx="22" fill="#1b7a49"/>
      <text x="60" y="29" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">Buy now</text>
    </g>
    <line x1="400" y1="64" x2="400" y2="126" stroke="#1b7a49" stroke-width="2"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
